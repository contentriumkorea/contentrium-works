<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430"><rect width="1200" height="430" rx="24" fill="#f2f7f6"/><g font-family="Segoe UI,Arial,sans-serif"><text x="48" y="65" font-size="29" font-weight="700" fill="#153b40">From a new request to the next handoff</text><g fill="white" stroke="#c5d8d4"><rect x="45" y="110" width="250" height="210" rx="18"/><rect x="330" y="110" width="250" height="210" rx="18"/><rect x="615" y="110" width="250" height="210" rx="18"/><rect x="900" y="110" width="250" height="210" rx="18"/></g><g font-size="21" font-weight="700" fill="#16785e"><text x="67" y="156">CHECK</text><text x="352" y="156">CONFIRM</text><text x="637" y="156">WORK</text><text x="922" y="156">RESUME</text></g><g font-size="17" fill="#35565c"><text x="67" y="202">Existing project</text><text x="67" y="233">Actual paths</text><text x="67" y="264">Previous records</text><text x="352" y="202">New folders</text><text x="352" y="233">External copies</text><text x="352" y="264">Required installs</text><text x="637" y="202">Use approved paths</text><text x="637" y="233">Verify saved files</text><text x="637" y="264">Record decisions</text><text x="922" y="202">Read the handoff</text><text x="922" y="233">Check current files</text><text x="922" y="264">Continue in new chat</text></g><text x="48" y="379" font-size="17" fill="#527079">Guided workflow — not a sync service or a filesystem lock.</text></g></svg>